<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: solid 2px black;
            box-sizing: border-box;
        }
        .container{
            display: flex;
            width: 400px;
        }
        .xx{
            width: calc(100%/3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="xx">item1</div>
        <div class="xx">item2</div>
        <div class="xx">item3</div>
    </div>
</body>
</html>
